name: Deploy Latest
on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.yarn
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: Install dependencies
        run: yarn install && yarn global add gulp-cli
      - name: Build libraries with different data sets
        run: |
          gulp build --production --env env/env.production.js
          gulp build --production --env env/env.development.js
          gulp build --production --env env/env.beta.js
      - name: Build documentation
        run: yarn run build:docs

      - name: Upload dist to S3 (Ceph)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          # newer AWS CLI adds checksums that Ceph RGW may reject
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          aws configure set default.s3.addressing_style path
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET }}/latest/ \
            --endpoint-url "${{ secrets.AWS_S3_ENDPOINT }}" \
            --acl public-read \
            --delete
